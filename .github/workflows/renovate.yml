name: Renovate

on:
  schedule:
    - cron: "0 4 * * 1-5"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: canonical/sdkcraft-actions/.github/workflows/renovate.yml@main
    secrets:
      token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}

  trigger-pr-checks:
    needs: renovate
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Dispatch Build SDK for Renovate PRs missing checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          sleep 5
          gh pr list --repo "$REPO" --state open --json headRefName,headRefOid,isCrossRepository \
            --jq '.[] | select((.isCrossRepository | not) and (.headRefName | startswith("renovate/"))) | "\(.headRefName) \(.headRefOid)"' |
          while read -r branch sha; do
            [ -n "$branch" ] || continue
            existing=$(gh api "repos/$REPO/actions/workflows/build.yml/runs?head_sha=$sha" --jq '.total_count')
            if [ "${existing:-0}" -eq 0 ]; then
              echo "Dispatching Build SDK for $branch ($sha)"
              gh workflow run build.yml --repo "$REPO" --ref "$branch"
            else
              echo "Build SDK already triggered for $branch ($sha)"
            fi
          done
